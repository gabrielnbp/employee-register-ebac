<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <h1 class="d-flex justify-content-center">Employee Register</h1>
                <form>
                    <label class="form-label" for="nome">Nome:</label>
                    <input class="form-control mb-3" type="text" name="nome" id="nome">
                    <label class="form-label" for="email">E-mail:</label>
                    <input class="form-control mb-3" type="email" name="email" id="email">
                    <label class="form-label" for="telefone">Telefone:</label>
                    <input class="form-control mb-3" type="tel" name="telefone" id="telefone">
                    <label for="observacao">Observações:</label>
                    <textarea class="form-control mb-3" name="observacao" id="observacao" rows="5"></textarea>
                    <div class="form-check">
                        <label class="form-check-label" for="aceite-termos">Li e concordo com os <a href="#">termos de
                                serviço</a>.</label>
                        <input class="form-check-input" type="checkbox" name="aceite-termos" id="aceite-termos">
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
