<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <h1 class="d-flex justify-content-center">Employee Register</h1>
                <form>

                    <div class="row mb-3 align-items-center">
                        <div class="col-auto">
                            <label class="form-label" for="nome">Nome:</label>
                        </div>
                        <div class="col">
                            <input class="form-control" type="text" name="nome" id="nome">
                        </div>
                        <div class="col-auto">
                            <label class="form-label" for="nome">Sobrenome:</label>
                        </div>
                        <div class="col">
                            <input class="form-control" type="text" name="nome" id="nome">
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <div class="col-auto">
                            <label class="form-label" for="nome">E-mail:</label>
                        </div>
                        <div class="col">
                            <input class="form-control" type="email" name="email" id="email">
                        </div>
                        <div class="col-auto">
                            <label class="form-label" for="telefone">Telefone:</label>
                        </div>
                        <div class="col">
                            <input class="form-control" type="tel" name="telefone" id="telefone">
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center justify-content-between">
                        <div class="col-auto">
                            <label class="form-label" for="cpf">CPF:</label>
                        </div>
                        <div class="col">
                            <input class="form-control" type="text" name="cpf" id="cpf">
                        </div>
                        <div class="col-auto">
                            <label class="form-label" for="data-nascimento">Data de Nascimento:</label>
                        </div>
                        <div class="col-auto">
                            <input class="form-control" type="date" name="data-nascimento" id="data-nascimento">
                        </div>
                        <div class="col-auto">
                            <label class="form-label" for="genero">Gênero:</label>
                        </div>
                        <div class="col-auto align-items-center">
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="genero" id="masculino" value="masculino">
                                <label class="form-check-label" for="masculino">Masculino</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="genero" id="feminino" value="feminino">
                                <label class="form-check-label" for="feminino">Feminino</label>
                            </div>
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <div class="col-auto">
                            <label class="form-label" for="endereco">Endereço:</label>
                        </div>
                        <div class="col">
                            <input class="form-control" type="text" name="endereco" id="endereco">
                        </div>
                    </div>

                    <label for="observacao">Observações:</label>
                    <textarea class="form-control mb-3" name="observacao" id="observacao" rows="5"></textarea>
                    
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="form-check">
                            <label class="form-check-label" for="aceite-termos">Li e concordo com os <a href="#">termos de serviço</a>.</label>
                            <input class="form-check-input" type="checkbox" name="aceite-termos" id="aceite-termos">
                        </div>

                        <button class="btn btn-primary px-5 py-2">Cadastrar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
